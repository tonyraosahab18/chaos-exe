<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAOS.EXE | Aao Dimag Ka Dahi Karein</title>
    <style>
        :root {
            --bg-color: #07030f;
            --primary-purple: #9d4edd;
            --neon-pink: #ff007f;
            --neon-glow: #c77dff;
            --dark-glass: rgba(18, 10, 30, 0.85);
            --border-glass: rgba(199, 125, 255, 0.3);
            --text-main: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 50% 20%, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 950px;
            background: #000;
            border: 3px solid #240046;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(157, 78, 221, 0.35);
        }

        .top-header {
            padding: 15px 20px;
            background: rgba(10, 2, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #c77dff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
        }

        .tagline {
            font-size: 0.75rem;
            color: #e0aaff;
            margin-top: 2px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .creator-credit {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .main-scroll::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 4px;
        }

        .chaos-hero {
            background: var(--dark-glass);
            border: 1px solid var(--border-glass);
            padding: 18px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .chaos-hero h2 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #ffd6ff;
        }

        .chaos-hero p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        .chaos-btn {
            background: linear-gradient(45deg, #7b2cbf, #ff007f);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            width: 100%;
            transition: transform 0.2s;
        }

        .chaos-btn:active {
            transform: scale(0.96);
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            background: rgba(25, 10, 40, 0.8);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            color: #ddd;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: var(--primary-purple);
            color: white;
            border-color: var(--neon-glow);
            box-shadow: 0 0 8px var(--primary-purple);
        }

        .chaos-card-output {
            background: rgba(15, 5, 25, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .output-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #f1d3fe;
            margin-bottom: 10px;
        }

        /* Poll Options Styling for Would You Rather */
        .poll-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            width: 100%;
        }

        .poll-btn {
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .poll-btn:hover {
            background: rgba(157, 78, 221, 0.4);
            border-color: var(--neon-pink);
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .mini-tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #e0aaff;
            margin-top: 5px;
            margin-bottom: 2px;
        }

        .minigames-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 20px;
        }

        .game-card {
            background: rgba(20, 8, 35, 0.8);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .game-card:active {
            transform: scale(0.95);
            border-color: var(--neon-pink);
        }

        .game-icon {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .game-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-header">
            <div class="brand-title">CHAOS.EXE</div>
            <div class="tagline">Aao Dimag Ka Dahi Karein 🔥</div>
            <div class="creator-credit">Created by Tony RaoSahab</div>
        </div>

        <div class="main-scroll">
            <div class="chaos-hero">
                <h2>Boredom Destroyer</h2>
                <p>Ek click aur saara stress gayab!</p>
                <button class="chaos-btn" id="chaosGenBtn">⚡ Give Me Some Chaos</button>
            </div>

            <div class="categories-scroll">
                <button class="cat-chip active" data-cat="all">All</button>
                <button class="cat-chip" data-cat="school">School Life</button>
                <button class="cat-chip" data-cat="savage">Savage Roasts</button>
                <button class="cat-chip" data-cat="relatable">Relatable</button>
                <button class="cat-chip" data-cat="random">Random</button>
            </div>

            <div class="chaos-card-output">
                <div class="output-text" id="chaosOutput">
                    "Loading ultimate Indian internet chaos..."
                </div>
                <div id="pollArea"></div>
                <div class="card-actions">
                    <button class="mini-tool-btn" id="copyChaosBtn">📋 Copy</button>
                    <button class="mini-tool-btn" id="favChaosBtn">⭐ Save</button>
                </div>
            </div>

            <div class="section-title">🎮 Choose Your Poison</div>
            <div class="minigames-grid">
                <div class="game-card" onclick="triggerMiniGame('Random Chaos')">
                    <div class="game-icon">🌪️</div>
                    <div class="game-name">Random Chaos</div>
                </div>
                <div class="game-card" onclick="triggerMiniGame('Personality Test')">
                    <div class="game-icon">🧠</div>
                    <div class="game-name">Personality Test</div>
                </div>
                <div class="game-card" onclick="triggerMiniGame('Would You Rather')">
                    <div class="game-icon">⚖️</div>
                    <div class="game-name">Would You Rather?</div>
                </div>
                <div class="game-card" onclick="triggerMiniGame('Excuse Maker')">
                    <div class="game-icon">🎭</div>
                    <div class="game-name">Excuse Maker</div>
                </div>
                <div class="game-card" onclick="triggerMiniGame('Friendly Roast')">
                    <div class="game-icon">🔥</div>
                    <div class="game-name">Friendly Roast</div>
                </div>
                <div class="game-card" onclick="triggerMiniGame('Random Mission')">
                    <div class="game-icon">🎯</div>
                    <div class="game-name">Random Mission</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allMemesData = {
            school: [
                "Backbencher ki superpower: Bina ek bhi shabd padhe viva me full confidence ke sath examiner ko convince karna.",
                "Jab teacher bole 'Main puri class se poochungi' aur saari saansein thamm jayein.",
                "School ki assembly me dhoop me khade hokar principal ka speech sunna ek alag hi tapasya thi.",
                "Exam me jab 2 mark ka question na aaye toh us par 3 page ka essay aise likho jaise examiner tumhara saga chacha ho.",
                "PT period cancel hone par poori class ka ek sath dukh manana.",
                "Blackboard saaf karne ki punishment ko ek proud moment samajhna."
            ],
            savage: [
                "Apne doston ko roast karna birthright hai, par koi aur kare toh khoon khol jata hai.",
                "Log kehte hain 'Hard work beats talent', par kabhi lazy genius ko bina padhe topper bante dekha hai?",
                "Tumhara gyaan dekh kar lagta hai ki Google ko bhi vacation par bhej dena chahiye.",
                "Aapka confidence dekh kar lagta hai ki bewakoofi me PhD kar rakhi hai.",
                "Jitna dimaag tumne mujhe gyaan dene me lagaya hai, utna lagate toh aaj tumhara khud ka startup hota."
            ],
            relatable: [
                "Phone ki battery 1% hone par speedrun mode activate ho jata hai.",
                "Online shopping me cart me 50 items add karne ke baad 'Cash on Delivery' par click karke order cancel kar dena.",
                "Raat ko sone se pehle achanak 5 saal pehle ki gayi ek embarrassing yaad ka aana.",
                "Fridge khol kar 10 minute tak khade rehna aur bina kuch liye band kar dena.",
                "Mummy jab ghar me guests aane par alag hi level ki English bolne lagti hain."
            ],
            random: [
                "Jab aapko lage ki aapki life set hai, tab achanak se relative ka phone aa jata hai: 'Beta, Sharma ji ke bete ko dekho!'",
                "Raat ko 2 baje achanak yaad aata hai ki kal subah 8 baje project submission hai.",
                "Life me itne dukh hain ki ab dukh bhi kehta hai 'Bhai ab main bhi thak gaya hoon'.",
                "Mummy ka chappal wala weapon itna accurate hota hai ki GPS bhi fail ho jaye."
            ]
        };

        const gamePromptsDatabase = {
            'Random Chaos': [
                "Chaos 1: Aaj bina kisi wajah ke ghar walo ke saamne hasna start karo aur unka reaction dekho!",
                "Chaos 2: Kisi random dost ko call karo aur bolo 'Bhai wo baat kisi ko mat batana' aur call kat do!",
                "Chaos 3: Mirror ke samne khade hokar 1 minute tak bina blink kiye khud ko dekho.",
                "Chaos 4: Apne kisi group me 'Guys hume baat karni chahiye...' likho aur offline ho jao.",
                "Chaos 5: Fridge khol kar bolo 'Aaj phir kuch nahi hai' chahe wo pura bhara ho.",
                "Chaos 6: Apne phone ki ringtone badal kar koi suspense sound laga lo.",
                "Chaos 7: Aaj subah uthte hi sabse pehle 5 baar zor se bolo 'Main Hero Hoon!'.",
                "Chaos 8: Apne best friend ko ek mysterious wala emoji 🗿 bhejo aur kuch mat bolo.",
                "Chaos 9: Apne status par likho 'Big news coming soon...' aur 24 ghante tak shaant raho.",
                "Chaos 10: Aaj pure din me har baat ke baad bolo 'Par isme mera kya fayda?'"
            ],
            'Personality Test': [
                "Result: Tumhara vibe 90% 'Professional Overthinker' aur 10% 'Chalta Hai' attitude wala hai!",
                "Result: Tum 100% Backbencher Mindset ke ho—Kaam aakhri 5 minute me hi hota hai!",
                "Result: Tumhara Vibe: 'Aalsi Genius'—Dimaag bahut hai par bed se uthne ka mann nahi karta.",
                "Result: Tum 80% Meme Addict aur 20% Normal Insaan ho!",
                "Result: Personality: 'Social Battery 2%'—Ghar baith kar reel dekhna hi asli sukoon hai.",
                "Result: Vibe Check: Tumhara attitude 'Dekha Jayega' par chal raha hai!",
                "Result: Tum Main Character Energy rakhte ho, bas budget thoda kam hai!",
                "Result: Tumhare andar ka Detective hamesha doosron ki Insta stalk karne me busy rehta hai.",
                "Result: Personality: 'Night Owl'—Raat ko 3 baje poori duniya jeetne ka plan banate ho.",
                "Result: Tum ek Walking Entertainment Center ho, doston ki jaan ho!"
            ],
            'Would You Rather': [
                { type: 'poll', title: "Saari zindagi sirf maggi khana", optionA: "🍔 Haa, bas maggi hi maggi!", optionB: "❌ Nahi bhai, roti sabji chahiye!" },
                { type: 'poll', title: "Har roz subah 5 baje uthna", optionA: "🌅 Done, healthy lifestyle!", optionB: "🛌 Na baba na, dopahar tak sona hai!" },
                { type: 'poll', title: "Apni saari search history mummy ko dikhana", optionA: "💀 Seedha yamraj ke paas jaunga", optionB: "🔍 Kuch bhi nahi chhupana!" },
                { type: 'poll', title: "1 saal tak bina internet ke rehna", optionA: "🌿 Sanyas le lunga", optionB: "😭 Depression me chala jaunga" },
                { type: 'poll', title: "Exam me bina padhe 90% lana", optionA: "🔥 Magical genius hoon main", optionB: "🧐 Cheating ka ilzaam lagega!" },
                { type: 'poll', title: "Hamesha loud speaker par baat karna", optionA: "📢 Poori duniya sune meri baatein", optionB: "🤫 Shanti pasand hai mujhe" },
                { type: 'poll', title: "Free unlimited pizza for life", optionA: "🍕 Roz party hi party!", optionB: "🥗 Doctor mana kar dega" },
                { type: 'poll', title: "Bhoot ke sath ek raat rehna", optionA: "👻 Dost bana lunga", optionB: "🏃‍♂️ 100 ki speed se bhaagunga" },
                { type: 'poll', title: "Apne ex ke sath 1 ghanta baat karna", optionA: "📞 Drama dekhne me maza aayega", optionB: "🚫 Block and delete forever" },
                { type: 'poll', title: "Hamesha sach bolna", optionA: "😇 Honest boy/girl", optionB: "🤥 Thoda bohot jhoot zaroori hai" }
            ],
            'Excuse Maker': [
                "Excuse 1: Sir, light chali gayi thi aur mere dimaag ka inverter bhi off ho gaya tha!",
                "Excuse 2: Mummy ne bola pehle dhaniya laao, fir padhai karna!",
                "Excuse 3: Mera phone automatic update par chala gaya tha aur 12 ghante lag gaye.",
                "Excuse 4: Mere dog ne mera assignment PDF samajh kar delete kar diya!",
                "Excuse 5: Sir, raste me alien spaceship ne mera rasta rok liya tha.",
                "Excuse 6: Alarm ne dhokha diya sir, wo bajne ki jagah khud so gaya!",
                "Excuse 7: Achanak se mere dimaag ka RAM full ho gaya tha, isliye crash ho gaya.",
                "Excuse 8: Subah uthte hi mujhe mehsoos hua ki aaj grah nakshatra sahi nahi hain.",
                "Excuse 9: Main toh aane wala tha par meri chappal tut gayi!",
                "Excuse 10: Wifi ka signal mere room tak aate aate thak gaya tha."
            ],
            'Friendly Roast': [
                "Roast 1: Tumhe dekh kar lagta hai ki evolution ne beech me hi break le liya tha!",
                "Roast 2: Tumhara dimaag 4G network par bhi 2G speed se chalta hai.",
                "Roast 3: Jitna dimaag tum me hai, utne me toh ek calculator bhi fail ho jaye.",
                "Roast 4: Tumhari baat sun kar Google ne bhi search karna band kar diya.",
                "Roast 5: Tumhara confidence dekh kar overconfidence ko bhi sharm aa jaye!",
                "Roast 6: Tum itne silent ho ki lagta hai background noise chal raha hai.",
                "Roast 7: Tumhe dekh kar lagta hai ki bhagwan ne tumhe F12 daba kar refresh karna bhool gaye.",
                "Roast 8: Tumhare jokes itne thande hote hain ki fridge me rakhne ki zaroorat nahi.",
                "Roast 9: Tumhari baat ka na koi head hota hai na tail, bas pure chaos hota hai!",
                "Roast 10: Bhai tumhara attitude iPhone jaisa hai, par battery 1% hi rehti hai."
            ],
            'Random Mission': [
                "Mission 1: Abhi turant apne kisi dost ko ek random emoji 🤡 bhejo bina kuch kahe!",
                "Mission 2: Aaj 10 minute tak bina phone chooye shanti se baitho.",
                "Mission 3: Apne Mummy/Papa ko jaakar bolo 'Aap duniya ke best ho' aur unka smile dekho.",
                "Mission 4: Kisi purane dost ko message karo: 'Yaad hai wo din?' aur dekho wo kya bolta hai.",
                "Mission 5: Aaj ek naya meme dhoondh kar apne story par lagao.",
                "Mission 6: Apne phone ki gallery kholo aur 5th photo ko kisi dost ko bhejo.",
                "Mission 7: 1 minute ke liye aakhein band karke bas gehari saans lo.",
                "Mission 8: Apne favorite song ko full volume me 2 minute suno.",
                "Mission 9: Aaj kisi ki bina kisi matlab ke tareef karo.",
                "Mission 10: Apne room ki ek cheez ko perfectly jagah par rakho."
            ]
        };

        let currentCategory = 'all';
        let shownIndices = {}; // Prevent quick repeats tracker

        async function loadMemesData() {
            try {
                const response = await fetch('memes.json');
                if(response.ok) {
                    const jsonData = await response.json();
                    if(jsonData && Object.keys(jsonData).length > 0) {
                        allMemesData = jsonData;
                    }
                }
            } catch (error) {
                console.log("Using built-in memes database.");
            }
            generateChaos();
        }

        function getActiveList() {
            if (currentCategory === 'all') {
                let combined = [];
                Object.values(allMemesData).forEach(arr => {
                    if(Array.isArray(arr)) combined.push(...arr);
                });
                return combined.length > 0 ? combined : ["Aao dimag ka dahi karein!"];
            }
            return (allMemesData[currentCategory] && allMemesData[currentCategory].length > 0) 
                ? allMemesData[currentCategory] 
                : ["Category update ho rahi hai!"];
        }

        const chaosGenBtn = document.getElementById('chaosGenBtn');
        const chaosOutput = document.getElementById('chaosOutput');
        const pollArea = document.getElementById('pollArea');
        const catChips = document.querySelectorAll('.cat-chip');

        catChips.forEach(chip => {
            chip.addEventListener('click', () => {
                catChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.getAttribute('data-cat');
                generateChaos();
            });
        });

        // Smart Random Selector with No-Repeat Logic
        function getUniqueRandom(list, key) {
            if (!shownIndices[key]) shownIndices[key] = [];
            if (shownIndices[key].length >= list.length) {
                shownIndices[key] = []; // Reset when all shown once
            }
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * list.length);
            } while (shownIndices[key].includes(randomIndex) && list.length > 1);

            shownIndices[key].push(randomIndex);
            return list[randomIndex];
        }

        function generateChaos() {
            pollArea.innerHTML = '';
            const list = getActiveList();
            const randomMsg = getUniqueRandom(list, 'cat_' + currentCategory);
            chaosOutput.textContent = `"${randomMsg}"`;
        }

        if(chaosGenBtn) {
            chaosGenBtn.addEventListener('click', generateChaos);
        }

        document.getElementById('copyChaosBtn').addEventListener('click', () => {
            const textToCopy = chaosOutput.textContent + (pollArea.innerText ? "\n" + pollArea.innerText : "");
            navigator.clipboard.writeText(textToCopy);
            alert('Copied to clipboard! 📋');
        });

        document.getElementById('favChaosBtn').addEventListener('click', () => {
            alert('Saved to favorites successfully! ⭐');
        });

        // Trigger Mini-Games with Poll Support & No-Repeat System
        function triggerMiniGame(gameName) {
            pollArea.innerHTML = '';
            const options = gamePromptsDatabase[gameName];
            if (!options || options.length === 0) return;

            const selected = getUniqueRandom(options, 'game_' + gameName);

            if (gameName === 'Would You Rather' && typeof selected === 'object') {
                chaosOutput.textContent = `[Would You Rather] ${selected.title}?`;
                pollArea.innerHTML = `
                    <div class="poll-container">
                        <button class="poll-btn" onclick="votePoll(this, '43%')">A) ${selected.optionA}</button>
                        <button class="poll-btn" onclick="votePoll(this, '57%')">B) ${selected.optionB}</button>
                    </div>
                `;
            } else {
                chaosOutput.textContent = `[${gameName}] ${selected}`;
            }
        }

        function votePoll(btn, percentage) {
            const buttons = pollArea.querySelectorAll('.poll-btn');
            buttons.forEach(b => {
                b.style.pointerEvents = 'none';
                b.style.opacity = '0.7';
            });
            btn.style.background = 'var(--primary-purple)';
            btn.innerHTML += ` ✅ <b>(${percentage} votes)</b>`;
        }

        loadMemesData();
    </script>
</body>
</html>
